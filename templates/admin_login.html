<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login - RailBook</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>

        .admin-login-container {
            max-width: 450px;
            margin: 70px auto;
            padding: 20px;
        }

        .admin-login-card {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.12);
        }

        .admin-login-card h1 {
            text-align: center;
            color: #173b70;
            margin-bottom: 10px;
        }

        .admin-login-card p {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        .admin-form-group {
            margin-bottom: 20px;
        }

        .admin-form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .admin-form-group input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        .admin-login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 7px;
            background: #173b70;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .admin-login-btn:hover {
            background: #102d57;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #173b70;
            text-decoration: none;
            font-weight: bold;
        }

    </style>

</head>


<body>


<!-- NAVBAR -->

<div class="navbar">

    <div class="logo">
        RailBook Admin
    </div>

</div>


<!-- ADMIN LOGIN -->

<div class="admin-login-container">

    <div class="admin-login-card">

        <h1>
            🔐 Admin Login
        </h1>

        <p>
            Login to access the Railway Administration Panel
        </p>


        <form action="/admin-login"
              method="POST">


            <div class="admin-form-group">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter admin email"
                    required
                >

            </div>


            <div class="admin-form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter admin password"
                    required
                >

            </div>


            <button
                type="submit"
                class="admin-login-btn">

                Login as Admin

            </button>


        </form>


        <a href="/"
           class="back-home">

            ← Back to Home

        </a>

    </div>

</div>


<!-- FOOTER -->

<div class="footer">

    © 2026 RailBook | Admin Portal

</div>


</body>

</html>
